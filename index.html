<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transkun Studio - Piano Audio to MIDI Visualizer</title>
  <!-- Tone.js & @tonejs/midi CDN -->
  <script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #22c55e;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      padding: 16px 24px;
      background: #090d16;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    header h1 {
      margin: 0;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .api-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      max-width: 520px;
    }
    .api-bar input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 0.875rem;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--muted);
      display: inline-block;
    }
    .status-dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .status-dot.offline { background: var(--danger); }

    main {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      background: #0f172a;
      padding: 4px;
      border-radius: 8px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .tab-btn.active {
      background: var(--panel);
      color: var(--accent);
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
    }
    .btn {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #0f172a;
      transition: background 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover:not(:disabled) { background: var(--accent-hover); color: #fff; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: #334155;
      color: var(--text);
    }
    .btn-secondary:hover:not(:disabled) { background: #475569; }

    #logBox {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #090d16;
      font-family: monospace;
      font-size: 0.82rem;
      color: var(--muted);
      min-height: 80px;
      max-height: 180px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    /* Visualizer Area */
    .visualizer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
    }
    .transport-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .seek-bar {
      width: 100%;
      margin: 8px 0 14px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .canvas-container {
      position: relative;
      background: #070a12;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
    }
    .meta-bar {
      display: flex;
      gap: 16px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--muted);
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

<header>
  <h1>🎹 Transkun Studio</h1>
  <div class="api-bar">
    <span id="statusDot" class="status-dot" title="API接続状態"></span>
    <input type="text" id="apiUrlInput" placeholder="ColabのURL (https://xxxx.trycloudflare.com)" />
    <button class="btn btn-secondary" id="checkApiBtn">接続確認</button>
  </div>
</header>

<main>
  <!-- 左パネル：入力＆変換 -->
  <section class="card">
    <div class="tabs">
      <button class="tab-btn active" data-tab="youtube">YouTube URL</button>
      <button class="tab-btn" data-tab="audio">音声ファイル</button>
      <button class="tab-btn" data-tab="midi">MIDI直接読込</button>
    </div>

    <!-- Tab 1: YouTube -->
    <div id="tab-youtube" class="input-group">
      <label style="font-size:0.85rem; color:var(--muted);">ピアノ演奏のYouTube URL</label>
      <input type="text" id="youtubeUrl" placeholder="https://www.youtube.com/watch?v=..." />
      <button class="btn" id="convertYoutubeBtn">🚀 TranskunでMIDI変換</button>
    </div>

    <!-- Tab 2: Audio File -->
    <div id="tab-audio" class="input-group" style="display:none;">
      <label style="font-size:0.85rem; color:var(--muted);">音声ファイル (MP3 / WAV / FLAC / M4A)</label>
      <input type="file" id="audioFileInput" accept="audio/*,.mp3,.wav,.flac,.m4a,.ogg" />
      <button class="btn" id="convertAudioBtn">🚀 TranskunでMIDI変換</button>
    </div>

    <!-- Tab 3: Local MIDI -->
    <div id="tab-midi" class="input-group" style="display:none;">
      <label style="font-size:0.85rem; color:var(--muted);">手元のMIDIファイル (.mid) を直接表示</label>
      <input type="file" id="midiFileInput" accept=".mid,.midi" />
    </div>

    <div id="logBox">準備完了。ColabのURLを入力するか、手元のMIDIファイルを読み込んでください。</div>
  </section>

  <!-- 右パネル：ピアノロール・ビジュアライザー -->
  <section class="card">
    <div class="visualizer-header">
      <div class="transport-controls">
        <button class="btn" id="playPauseBtn" disabled>▶ 再生</button>
        <button class="btn btn-secondary" id="stopBtn" disabled>⏹ 停止</button>
        <select id="speedSelect" style="padding:8px; border-radius:6px; background:#0f172a; color:var(--text); border:1px solid var(--border);">
          <option value="0.5">0.5x</option>
          <option value="0.75">0.75x</option>
          <option value="1" selected>1.0x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
        </select>
        <span id="timeDisplay" style="font-family:monospace; font-size:0.9rem;">00:00.0 / 00:00.0</span>
      </div>
      <button class="btn btn-secondary" id="downloadMidiBtn" disabled>💾 MIDIダウンロード</button>
    </div>

    <input type="range" id="seekBar" class="seek-bar" min="0" max="100" step="0.05" value="0" disabled />

    <div class="canvas-container">
      <canvas id="pianoRollCanvas" width="800" height="460"></canvas>
    </div>

    <div class="meta-bar">
      <span id="metaFileName">ファイル: 未選択</span>
      <span id="metaNotes">総ノート数: -</span>
      <span id="metaActiveChord">発音中: -</span>
    </div>
  </section>
</main>

<script>
  // --- 状態管理 ---
  let currentMidi = null;
  let currentMidiBytes = null;
  let currentFileName = "output.mid";
  let isPlaying = false;
  let currentTime = 0;
  let duration = 0;
  let playbackSpeed = 1.0;
  let lastFrameTime = 0;
  let activeNoteIndices = new Set();
  let sampler = null;
  let samplerReady = false;

  const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  const MIN_PITCH = 21;  // A0
  const MAX_PITCH = 108; // C8
  const TOTAL_KEYS = MAX_PITCH - MIN_PITCH + 1; // 88 keys

  // DOM要素
  const apiUrlInput = document.getElementById("apiUrlInput");
  const checkApiBtn = document.getElementById("checkApiBtn");
  const statusDot = document.getElementById("statusDot");
  const logBox = document.getElementById("logBox");
  const playPauseBtn = document.getElementById("playPauseBtn");
  const stopBtn = document.getElementById("stopBtn");
  const speedSelect = document.getElementById("speedSelect");
  const seekBar = document.getElementById("seekBar");
  const timeDisplay = document.getElementById("timeDisplay");
  const downloadMidiBtn = document.getElementById("downloadMidiBtn");
  const canvas = document.getElementById("pianoRollCanvas");
  const ctx = canvas.getContext("2d");

  // ローカルストレージからAPI URLを復元
  const savedApiUrl = localStorage.getItem("transkun_api_url");
  if (savedApiUrl) apiUrlInput.value = savedApiUrl;

  function log(msg) {
    const time = new Date().toLocaleTimeString();
    logBox.textContent = `[${time}] ${msg}\n` + logBox.textContent;
  }

  function getApiBase() {
    const raw = apiUrlInput.value.trim().replace(/\/+$/, "");
    localStorage.setItem("transkun_api_url", raw);
    return raw;
  }

  // --- タブ切り替え ---
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      const target = btn.dataset.tab;
      document.getElementById("tab-youtube").style.display = target === "youtube" ? "flex" : "none";
      document.getElementById("tab-audio").style.display = target === "audio" ? "flex" : "none";
      document.getElementById("tab-midi").style.display = target === "midi" ? "flex" : "none";
    });
  });

  // --- Salamander Grand Piano Sampler 初期化 ---
  async function initSampler() {
    if (sampler) return;
    log("ピアノ音源 (Salamander Grand Piano) を読み込み中...");
    sampler = new Tone.Sampler({
      urls: {
        A0: "A0.mp3", C1: "C1.mp3", "D#1": "Ds1.mp3", "F#1": "Fs1.mp3",
        A1: "A1.mp3", C2: "C2.mp3", "D#2": "Ds2.mp3", "F#2": "Fs2.mp3",
        A2: "A2.mp3", C3: "C3.mp3", "D#3": "Ds3.mp3", "F#3": "Fs3.mp3",
        A3: "A3.mp3", C4: "C4.mp3", "D#4": "Ds4.mp3", "F#4": "Fs4.mp3",
        A4: "A4.mp3", C5: "C5.mp3", "D#5": "Ds5.mp3", "F#5": "Fs5.mp3",
        A5: "A5.mp3", C6: "C6.mp3", "D#6": "Ds6.mp3", "F#6": "Fs6.mp3",
        A6: "A6.mp3", C7: "C7.mp3", "D#7": "Ds7.mp3", "F#7": "Fs7.mp3",
        A7: "A7.mp3", C8: "C8.mp3"
      },
      release: 1,
      baseUrl: "https://tonejs.github.io/audio/salamander/",
      onload: () => {
        samplerReady = true;
        log("ピアノ音源の準備が完了しました！");
      }
    }).toDestination();
  }

  // --- API接続確認 ---
  checkApiBtn.addEventListener("click", async () => {
    const base = getApiBase();
    if (!base) return alert("ColabのURLを入力してください");
    try {
      log("サーバー接続を確認中...");
      const res = await fetch(`${base}/health`);
      const data = await res.json();
      statusDot.className = "status-dot online";
      log(`接続成功！ バックエンド演算デバイス: ${data.device.toUpperCase()}`);
    } catch (e) {
      statusDot.className = "status-dot offline";
      log("接続失敗: URLが正しいか、Colabが起動中か確認してください。");
    }
  });

  // --- YouTube変換 ---
  document.getElementById("convertYoutubeBtn").addEventListener("click", async () => {
    const base = getApiBase();
    const url = document.getElementById("youtubeUrl").value.trim();
    if (!base) return alert("上部にColabのAPIサーバーURLを入力してください");
    if (!url) return alert("YouTubeのURLを入力してください");

    const btn = document.getElementById("convertYoutubeBtn");
    btn.disabled = true;
    log("YouTubeから音声を取得し、TranskunでMIDIへ変換しています（数分かかる場合があります）...");

    try {
      const res = await fetch(`${base}/transcribe/youtube`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url })
      });
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.detail || "変換エラー");
      }
      const data = await res.json();
      loadBase64Midi(data.midi_base64, data.filename);
      log(`変換完了！ (${data.filename})`);
    } catch (e) {
      log(`エラー: ${e.message}`);
    } finally {
      btn.disabled = false;
    }
  });

  // --- 音声ファイル変換 ---
  document.getElementById("convertAudioBtn").addEventListener("click", async () => {
    const base = getApiBase();
    const fileInput = document.getElementById("audioFileInput");
    if (!base) return alert("上部にColabのAPIサーバーURLを入力してください");
    if (!fileInput.files.length) return alert("音声ファイルを選択してください");

    const file = fileInput.files[0];
    const formData = new FormData();
    formData.append("file", file);

    const btn = document.getElementById("convertAudioBtn");
    btn.disabled = true;
    log(`「${file.name}」をアップロードしてTranskunで変換中...`);

    try {
      const res = await fetch(`${base}/transcribe/file`, {
        method: "POST",
        body: formData
      });
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.detail || "変換エラー");
      }
      const data = await res.json();
      loadBase64Midi(data.midi_base64, data.filename);
      log(`変換完了！ (${data.filename})`);
    } catch (e) {
      log(`エラー: ${e.message}`);
    } finally {
      btn.disabled = false;
    }
  });

  // --- ローカルMIDI直接読み込み ---
  document.getElementById("midiFileInput").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const buf = await file.arrayBuffer();
    loadArrayBufferMidi(new Uint8Array(buf), file.name);
    log(`ローカルMIDI「${file.name}」を読み込みました。`);
  });

  function loadBase64Midi(b64, filename) {
    const binStr = atob(b64);
    const bytes = new Uint8Array(binStr.length);
    for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
    loadArrayBufferMidi(bytes, filename);
  }

  function loadArrayBufferMidi(bytes, filename) {
    stopPlayback();
    currentMidiBytes = bytes;
    currentFileName = filename;
    currentMidi = new Midi(bytes);
    duration = currentMidi.duration || 1;
    seekBar.max = duration;
    seekBar.value = 0;

    // 全トラックのノートを統合して時間順ソート
    let allNotes = [];
    currentMidi.tracks.forEach(t => {
      t.notes.forEach(n => allNotes.push(n));
    });
    allNotes.sort((a, b) => a.time - b.time);
    currentMidi._allNotes = allNotes;

    document.getElementById("metaFileName").textContent = `ファイル: ${filename}`;
    document.getElementById("metaNotes").textContent = `総ノート数: ${allNotes.length}`;
    playPauseBtn.disabled = false;
    stopBtn.disabled = false;
    seekBar.disabled = false;
    downloadMidiBtn.disabled = false;

    initSampler();
    updateTimeDisplay();
    drawPianoRoll();
  }

  // --- ダウンロード機能 ---
  downloadMidiBtn.addEventListener("click", () => {
    if (!currentMidiBytes) return;
    const blob = new Blob([currentMidiBytes], { type: "audio/midi" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = currentFileName;
    a.click();
    URL.revokeObjectURL(url);
  });

  // --- 再生・停止・シーク制御 ---
  playPauseBtn.addEventListener("click", async () => {
    await Tone.start();
    if (!sampler) await initSampler();
    if (isPlaying) {
      pausePlayback();
    } else {
      startPlayback();
    }
  });

  stopBtn.addEventListener("click", () => stopPlayback());

  speedSelect.addEventListener("change", (e) => {
    playbackSpeed = parseFloat(e.target.value);
  });

  seekBar.addEventListener("input", (e) => {
    currentTime = parseFloat(e.target.value);
    activeNoteIndices.clear();
    if (sampler && samplerReady) sampler.releaseAll();
    updateTimeDisplay();
    drawPianoRoll();
  });

  function startPlayback() {
    if (!currentMidi) return;
    if (currentTime >= duration) currentTime = 0;
    isPlaying = true;
    playPauseBtn.textContent = "⏸ 一時停止";
    lastFrameTime = performance.now();
    requestAnimationFrame(tick);
  }

  function pausePlayback() {
    isPlaying = false;
    playPauseBtn.textContent = "▶ 再生";
    if (sampler && samplerReady) sampler.releaseAll();
  }

  function stopPlayback() {
    pausePlayback();
    currentTime = 0;
    seekBar.value = 0;
    activeNoteIndices.clear();
    updateTimeDisplay();
    drawPianoRoll();
  }

  function midiToNoteName(midiNum) {
    const octave = Math.floor(midiNum / 12) - 1;
    const name = NOTE_NAMES[midiNum % 12];
    return `${name}${octave}`;
  }

  function formatTime(sec) {
    const m = Math.floor(sec / 60).toString().padStart(2, "0");
    const s = (sec % 60).toFixed(1).padStart(4, "0");
    return `${m}:${s}`;
  }

  function updateTimeDisplay() {
    timeDisplay.textContent = `${formatTime(currentTime)} / ${formatTime(duration)}`;
  }

  function tick(now) {
    if (!isPlaying) return;
    const dt = ((now - lastFrameTime) / 1000) * playbackSpeed;
    lastFrameTime = now;
    const prevTime = currentTime;
    currentTime += dt;

    if (currentTime >= duration) {
      stopPlayback();
      return;
    }

    seekBar.value = currentTime;
    updateTimeDisplay();

    // 新たに発音タイミングを迎えたノートをトリガー
    if (currentMidi && samplerReady) {
      const notes = currentMidi._allNotes;
      for (let i = 0; i < notes.length; i++) {
        const n = notes[i];
        if (n.time >= prevTime && n.time < currentTime) {
          sampler.triggerAttackRelease(
            midiToNoteName(n.midi),
            Math.max(0.05, n.duration / playbackSpeed),
            undefined,
            n.velocity
          );
        }
      }
    }

    drawPianoRoll();
    requestAnimationFrame(tick);
  }

  // --- Canvas ピアノロール描画 (落下式 + 88鍵盤) ---
  function isBlackKey(midiNum) {
    return [1, 3, 6, 8, 10].includes(midiNum % 12);
  }

  function drawPianoRoll() {
    const W = canvas.width;
    const H = canvas.height;
    const KEYBOARD_H = 68;
    const ROLL_H = H - KEYBOARD_H;
    const LOOKAHEAD_SEC = 4.0; // 画面内に表示する未来の秒数
    const keyWidth = W / TOTAL_KEYS;

    ctx.fillStyle = "#070a12";
    ctx.fillRect(0, 0, W, H);

    // オクターブ補助線
    for (let m = MIN_PITCH; m <= MAX_PITCH; m++) {
      const x = (m - MIN_PITCH) * keyWidth;
      if (m % 12 === 0) {
        ctx.strokeStyle = "#1e293b";
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, ROLL_H);
        ctx.stroke();
      }
    }

    const activePitches = new Set();
    const activeNames = [];

    // ノートの描画
    if (currentMidi && currentMidi._allNotes) {
      const notes = currentMidi._allNotes;
      for (let i = 0; i < notes.length; i++) {
        const n = notes[i];
        const noteEnd = n.time + n.duration;
        if (noteEnd < currentTime) continue;
        if (n.time > currentTime + LOOKAHEAD_SEC) break;

        const x = (n.midi - MIN_PITCH) * keyWidth;
        const yBottom = ROLL_H - ((n.time - currentTime) / LOOKAHEAD_SEC) * ROLL_H;
        const yTop = ROLL_H - ((noteEnd - currentTime) / LOOKAHEAD_SEC) * ROLL_H;
        const rectY = Math.max(0, yTop);
        const rectH = Math.max(4, Math.min(ROLL_H, yBottom) - rectY);

        // ベロシティに応じて色相・明度を変化
        const hue = 195 - Math.floor(n.velocity * 55);
        const isHit = n.time <= currentTime && noteEnd >= currentTime;
        if (isHit) {
          activePitches.add(n.midi);
          activeNames.push(midiToNoteName(n.midi));
          ctx.fillStyle = `hsl(${hue}, 95%, 68%)`;
        } else {
          ctx.fillStyle = `hsl(${hue}, 80%, 50%)`;
        }

        ctx.beginPath();
        ctx.roundRect(x + 0.5, rectY, Math.max(2, keyWidth - 1), rectH, 3);
        ctx.fill();
      }
    }

    document.getElementById("metaActiveChord").textContent =
      `発音中: ${activeNames.length ? activeNames.join(" ") : "-"}`;

    // 下部88鍵盤の描画
    for (let m = MIN_PITCH; m <= MAX_PITCH; m++) {
      const x = (m - MIN_PITCH) * keyWidth;
      const black = isBlackKey(m);
      const active = activePitches.has(m);

      if (active) {
        ctx.fillStyle = "#38bdf8";
      } else {
        ctx.fillStyle = black ? "#1e293b" : "#e2e8f0";
      }

      ctx.fillRect(x + 0.5, ROLL_H, keyWidth - 1, black ? KEYBOARD_H * 0.65 : KEYBOARD_H);

      // Cの音にオクターブ表記
      if (m % 12 === 0) {
        ctx.fillStyle = active ? "#0f172a" : "#475569";
        ctx.font = "9px sans-serif";
        ctx.fillText(`C${Math.floor(m / 12) - 1}`, x + 1, H - 6);
      }
    }

    // 鍵盤上部の境界ライン
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, ROLL_H);
    ctx.lineTo(W, ROLL_H);
    ctx.stroke();
    ctx.lineWidth = 1;
  }

  // 初期描画
  drawPianoRoll();
</script>
</body>
</html>
